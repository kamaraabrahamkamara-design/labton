<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Interactive Physics Virtual Laboratory</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lab-container">
 <header>
 <h1>Virtual Physics Experiment Platform</h1>
 <div class="selector-group">
 <label for="labSelect">Choose Experiment Module:</label>
 <select id="labSelect">
 <option value="spring">1. Hooke's Law (Spring Stretch)</option>
 <option value="pendulum">2. Damped Pendulum (Oscillation to Rest)</option>
 </select>
 </div>
 </header>
 <div class="lab-workspace">
 <div class="control-panel">
 <div id="springControls" class="experiment-controls">
 <div class="control-group">
 <label for="massSlider">Hanging Mass (m):</label>
 <input type="range" id="massSlider" min="0" max="500" step="25" value="0">
 </div>
 </div>
 <div id="pendulumControls" class="experiment-controls hidden">
 <div class="control-group">
 <label for="lengthSlider">Rope Length (L):</label>
 <input type="range" id="lengthSlider" min="0.5" max="2.5" step="0.05" value="1.5">
 </div>
 </div>
 </div>
 <div class="canvas-panel">
 <canvas id="labCanvas" width="450" height="500"></canvas>
 </div>
 </div>

 <!-- Added Academic Recognition Footer -->
 <footer style="margin-top: 20px; padding: 15px; text-align: center; border-top: 1px solid #ccc; font-family: sans-serif;">
 <p style="margin: 5px 0; font-size: 1.1em; color: #333;">
 <strong>Abraham P.Z. Kamara, BSc</strong>
 </p>
 <p style="margin: 5px 0; font-size: 0.9em; color: #555;">
 Biomedical Science | MVP of Academic Excellence
 </p>
 <p style="margin: 5px 0; font-size: 0.85em; color: #777; font-style: italic;">
 Department of Biological Sciences
 </p>
 </footer>
</div>
<script src="app.js"></script>
</body>
</html>
